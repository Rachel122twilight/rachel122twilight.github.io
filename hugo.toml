baseURL = "https://rachel122twilight.github.io/"
title = "Rachel122's Blog"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

[pagination]
pagerSize = 5

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "Rachel122's Blog"
description = "Rachel122's Blog"
keywords = ["Blog"]
author = "Me"
images = ["<link or path of image for opengraph, twitter-cards>"]
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false

[params.assets]
favicon = "https://avatars.githubusercontent.com/u/257100881"
favicon16x16 = "https://avatars.githubusercontent.com/u/257100881?v=4&size=16"
favicon32x32 = "https://avatars.githubusercontent.com/u/257100881?v=4&size=32"
apple_touch_icon = "https://avatars.githubusercontent.com/u/257100881"
safari_pinned_tab = "https://avatars.githubusercontent.com/u/257100881"

[params.label]
text = "Home"
icon = "https://avatars.githubusercontent.com/u/257100881"
iconHeight = 35

[params.profileMode]
enabled = false
title = "Rachel122's Blog"
subtitle = "Welcome"
imageUrl = "https://avatars.githubusercontent.com/u/257100881"
imageWidth = 120
imageHeight = 120
imageTitle = "my image"

[[params.profileMode.buttons]]
name = "Posts"
url = "posts"

[[params.profileMode.buttons]]
name = "Tags"
url = "tags"

[params.homeInfoParams]
Title = "Hello!"
Content = "Welcome to Rachel122's blog"

[[params.socialIcons]]
name = "x"
url = "https://x.com/rachel122t"

[[params.socialIcons]]
name = "bilibili"
url = "https://space.bilibili.com/3691003162659491"

[[params.socialIcons]]
name = "github"
url = "https://github.com/rachel122twilight"

[params.analytics.google]
SiteVerificationTag = "XYZabc"

[params.analytics.bing]
SiteVerificationTag = "XYZabc"

[params.analytics.yandex]
SiteVerificationTag = "XYZabc"

[params.cover]
hidden = true
hiddenInList = true
hiddenInSingle = true

[params.editPost]
URL = "https://github.com/<path_to_repo>/content"
Text = "Suggest Changes"
appendFilePath = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
identifier = "categories"
name = "categories"
url = "/categories/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "tags"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "rachel122twilight.github.io"
name = "rachel122twilight.github.io"
url = "https://rachel122twilight.github.io"
weight = 30

[markup.highlight]
noClasses = false
