media:
  input: "static/images"
  output: "/images"

content:
  - name: "posts"
    label: "Posts"
    type: "collection"
    path: "content/posts"
    create: true
    delete: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: description
        label: Description
        type: string
      - name: tags
        label: Tags
        type: list
      - name: body
        label: Body
        type: markdown
