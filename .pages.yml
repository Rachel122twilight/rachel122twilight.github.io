media:
  input: "static/images"
  output: "/images"

content:
  - name: "posts"
    label: "Posts"
    type: "collection"
    path: "content/posts"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: description
        label: Description
        type: string
      - name: categories
        label: Categories
        type: select
        options:
          multiple: true
          values: [Article]
      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          values: [Develop, Windows, macOS, Linux, Android, iOS, Bash, C, C++, C#, Java, JavaScript, Python, Flutter, Dart, HTML, Tool, Game, Draw, Program, AI, Phone, Computer, Script, Music]
      - name: cover
        label: Cover
        type: image
      - name: body
        label: Body
        type: rich-text
      - name: attachment
        label: 附件
        type: file