media:
  input: "static/images"
  output: "/images"

content:
  - name: "posts"
    label: "博客文章"
    type: "collection"
    path: "content/posts"
    create: true
    delete: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
      - name: draft
        label: 草稿
        type: boolean
        default: true
      - name: description
        label: 摘要
        type: string
      - name: tags
        label: 标签
        type: list
      - name: body
        label: 正文
        type: markdown
